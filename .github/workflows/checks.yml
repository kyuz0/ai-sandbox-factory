name: Checks and release
on:
  push:
    branches: [main]
    paths:
      - 'ai_sandbox_factory/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      candidate_index:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: checks-${{ inputs.ref || github.ref }}
  cancel-in-progress: false
jobs:
  python:
    name: Python tests ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python tests/check_button_heights.py --shard ${{ matrix.group }} ${{ strategy.job-total }}
  package:
    runs-on: ubuntu-latest
    outputs:
      package_changed: ${{ steps.package.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check for package changes
        id: package
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Include package changes left unpublished by an earlier failed run.
          if release=$(git describe --tags --abbrev=0 --first-parent --match 'v[0-9]*' "$AFTER" 2>/dev/null); then
            baseline=$release
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            baseline=$(git hash-object -t tree /dev/null)
          else
            baseline=$BEFORE
          fi
          status=0
          git diff --quiet "$baseline" "$AFTER" -- ai_sandbox_factory/ pyproject.toml MANIFEST.in || status=$?
          case "$status" in
            0) echo 'changed=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'changed=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require dependency pins on main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_dependency_main.py
      - run: npm ci --prefix ai_sandbox_factory/containers/inference --ignore-scripts
      - run: node --test tests/test_knowledge_policy.mjs tests/test_provider_runtime.mjs tests/test_web_search_policy.mjs tests/test_inference_broker.mjs tests/test_editor_watch_fallback.cjs tests/test_sandbox_context.mjs
      - run: |
          python -m pip wheel --no-deps . -w dist
          python -m venv /tmp/factory-package
          /tmp/factory-package/bin/pip install dist/ai_sandbox_factory-*.whl
          cd /tmp
          /tmp/factory-package/bin/ai-sandbox-factory --version
          /tmp/factory-package/bin/ai-sandbox-factory --help
          /tmp/factory-package/bin/ai-sandbox-factory profile list
          /tmp/factory-package/bin/ai-sandbox-factory provider list
  fresh-sandbox:
    name: Fresh Pi and FrostPi sandbox and lifecycle
    # Ubuntu 26.04's pasta profile can block rootless Podman network cleanup.
    # https://github.com/actions/runner-images/issues/15182
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.candidate_index != ''
        with:
          name: ${{ inputs.candidate_index }}
          path: /tmp/factory-published-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y podman socat
          podman version
          python -m pip install -e . playwright
          python -m playwright install --with-deps chromium
      - name: Check fresh project startup and mounted-folder permissions
        id: fresh
        run: |
          args=()
          if [[ -n "$CANDIDATE_INDEX" ]]; then
            args+=(--candidate-index /tmp/factory-published-candidate/images.lock.json --stock-tools)
          elif python3 -c 'import json,sys; sys.exit(not bool(json.load(open("ai_sandbox_factory/images.lock.json"))["images"]))'; then
            args+=(--candidate-index ai_sandbox_factory/images.lock.json --stock-tools)
          fi
          python tests/fresh_sandbox.py --output /tmp/factory-fresh-sandbox "${args[@]}"
        env:
          CANDIDATE_INDEX: ${{ inputs.candidate_index }}
      - name: Require fresh creation with a model provider and verify lifecycle locks
        if: ${{ !cancelled() && steps.fresh.outcome == 'success' }}
        shell: bash
        run: |
          image=$(cat /tmp/factory-fresh-sandbox/image-reference.txt)
          python tests/creation_provider.py --image "$image" 2>&1 | tee /tmp/factory-fresh-sandbox/provider-creation.log
      - name: Exercise the installed CLI with pipes and cancellation
        if: ${{ !cancelled() && steps.fresh.outcome == 'success' }}
        shell: bash
        run: |
          python -m pip wheel --no-deps . -w /tmp/factory-cli-wheel
          python -m venv --system-site-packages /tmp/factory-cli-installed
          /tmp/factory-cli-installed/bin/pip install --no-deps /tmp/factory-cli-wheel/*.whl
          cd /tmp
          PYTHONPATH="$GITHUB_WORKSPACE/tests" /tmp/factory-cli-installed/bin/python "$GITHUB_WORKSPACE/tests/cli_lifecycle_integration.py" --installed 2>&1 | tee /tmp/factory-fresh-sandbox/cli-lifecycle.log
      - name: Exercise background creation, rebuild and cancellation in the TUI
        if: ${{ !cancelled() && steps.fresh.outcome == 'success' }}
        shell: bash
        run: python tests/sandbox_jobs_integration.py 2>&1 | tee /tmp/factory-fresh-sandbox/jobs.log
      - name: Require immediate recovery from a failed profile commit
        if: ${{ !cancelled() && steps.fresh.outcome == 'success' }}
        shell: bash
        run: python tests/profile_commit_integration.py 2>&1 | tee /tmp/factory-fresh-sandbox/profile-commit.log
      - name: Restore saved service data
        if: ${{ !cancelled() && steps.fresh.outcome == 'success' }}
        shell: bash
        run: python tests/service_data_integration.py 2>&1 | tee /tmp/factory-fresh-sandbox/service-data.log
      - name: Preserve the open browser editor across updates and rollback
        if: ${{ !cancelled() && steps.fresh.outcome == 'success' }}
        shell: bash
        run: python tests/browser_editor_updates.py 2>&1 | tee /tmp/factory-fresh-sandbox/editor-updates.log
      - name: Apply reviewed container updates without interrupting unrelated work
        if: ${{ !cancelled() && steps.fresh.outcome == 'success' }}
        shell: bash
        run: |
          args=(--image "$(cat /tmp/factory-fresh-sandbox/image-reference.txt)")
          if [[ -n "$CANDIDATE_INDEX" ]]; then
            args+=(--candidate-index /tmp/factory-published-candidate/images.lock.json)
          fi
          python tests/container_updates_lifecycle.py "${args[@]}" 2>&1 | tee /tmp/factory-fresh-sandbox/container-updates.log
        env:
          CANDIDATE_INDEX: ${{ inputs.candidate_index }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-sandbox
          path: /tmp/factory-fresh-sandbox
  prebuilt-images:
    name: Prebuilt images and profile lifecycle
    # Keep stock images and registry exports off the fresh-client runner's disk.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.candidate_index != ''
        with:
          name: ${{ inputs.candidate_index }}
          path: /tmp/factory-published-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y podman socat
          podman version
          python -m pip install -e .
      - name: Record initial runner storage
        run: |
          factory_graphroot=$(podman info --format '{{.Store.GraphRoot}}')
          df -h "$factory_graphroot" /tmp
          df -i "$factory_graphroot" /tmp
      - name: Require prebuilt acquisition, pull cancellation, and profile recovery
        shell: bash
        env:
          CANDIDATE_INDEX: ${{ inputs.candidate_index }}
        run: |
          args=(--recovery)
          if [[ -n "$CANDIDATE_INDEX" ]]; then args=(--candidate-index /tmp/factory-published-candidate/images.lock.json); fi
          PYTHONPATH=tests:. python tests/prebuilt_images_integration.py --output /tmp/factory-prebuilt-check --profiles --interfaces --recipes "${args[@]}" 2>&1 | tee /tmp/factory-prebuilt-check.log
      - name: Record runner storage
        if: always()
        run: |
          factory_graphroot=$(podman info --format '{{.Store.GraphRoot}}')
          df -h "$factory_graphroot" /tmp
          df -i "$factory_graphroot" /tmp
          podman system df
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prebuilt-images
          path: |
            /tmp/factory-prebuilt-check.log
            /tmp/factory-prebuilt-check/results.json
            /tmp/factory-prebuilt-check/registry-requests.json
            /tmp/factory-prebuilt-check/pull-recovery-result.json
  published-plan:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Require the promoted index to match current build sources
        id: plan
        run: |
          python - <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from build_factory_images import validate_index
          path = Path('ai_sandbox_factory/images.lock.json')
          enabled = bool(json.loads(path.read_text())['images'])
          if enabled:
              validate_index(path)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('enabled=' + str(enabled).lower() + '\n')
          PYTHON
  published-native:
    name: Published ${{ matrix.agent }} client and credential isolation
    needs: published-plan
    if: needs.published-plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        agent: [codex, claude, agy]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native-client test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          python -m pip install -e .
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.2
      - name: Test the exact published native client
        env:
          AGENT: ${{ matrix.agent }}
        run: python tests/native_image_candidates.py --candidate-index ai_sandbox_factory/images.lock.json --agent "$AGENT"
      - name: Recheck current advisories before promotion
        env:
          AGENT: ${{ matrix.agent }}
        run: python scripts/scan_factory_images.py --index ai_sandbox_factory/images.lock.json --roles "controller-$AGENT" native-common --output /tmp/factory-native-scan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-${{ matrix.agent }}-scan
          path: /tmp/factory-native-scan
  published-helpers:
    needs: published-plan
    if: needs.published-plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install candidate verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          python -m pip install -e .
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.2
      - name: Pull and test the exact published helper and Pi images
        run: python scripts/build_factory_images.py --verify-index ai_sandbox_factory/images.lock.json --roles gateway inference ssh aws connector advisor pi-common pi-stock --output /tmp/factory-published-images.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-image-versions
          path: /tmp/factory-published-images.json
      - name: Recheck current advisories before promotion
        run: python scripts/scan_factory_images.py --index ai_sandbox_factory/images.lock.json --roles gateway inference ssh aws connector advisor pi-common pi-stock --output /tmp/factory-helper-scan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-helper-scan
          path: /tmp/factory-helper-scan
  test:
    needs: [python, package, fresh-sandbox, prebuilt-images, published-plan, published-native, published-helpers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        run: |
          test "${{ needs.python.result }}" = success
          test "${{ needs.package.result }}" = success
          test "${{ needs.fresh-sandbox.result }}" = success
          test "${{ needs.prebuilt-images.result }}" = success
          test "${{ needs.published-plan.result }}" = success
          if [[ "${{ needs.published-plan.outputs.enabled }}" == true ]]; then
            test "${{ needs.published-native.result }}" = success
            test "${{ needs.published-helpers.result }}" = success
          fi
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.candidate_index == '' && needs.package.outputs.package_changed == 'true'
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Version and tag
        id: release
        run: python3 scripts/prepare_factory_release.py
      - name: Retain released image tags and evidence
        if: steps.release.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/release-image-auth.json" --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
          python3 scripts/release_factory_images.py --version "$VERSION" --authfile "$RUNNER_TEMP/release-image-auth.json"
