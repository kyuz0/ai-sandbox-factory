name: Factory image candidates

on:
  push:
    tags: ['image-candidate-*']
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Push tested candidate images to Docker Hub from main
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  candidate:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [gateway, pi-common, pi-stock, native-common, controller-codex, controller-claude, controller-agy, advisor, ssh, aws, connector, inference]
    env:
      ROLE: ${{ matrix.role }}
      PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/image-candidate-')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish) }}
    steps:
      - name: Require main for publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo 'Select main to publish Factory image candidates.' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Factory and Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          python -m pip install -e .
      - name: Sign in for candidate publication
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | podman login --authfile "$RUNNER_TEMP/candidate-auth.json" --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
      - name: Build and test the candidate
        shell: bash
        run: |
          args=()
          if [[ "$PUBLISH" == true ]]; then
            args+=(--publish --push-authfile "$RUNNER_TEMP/candidate-auth.json")
          fi
          python scripts/build_factory_images.py --roles "$ROLE" --output "$RUNNER_TEMP/image-result/$ROLE.json" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.role }}
          path: ${{ runner.temp }}/image-result/${{ matrix.role }}.json
          if-no-files-found: error

  candidate-index:
    needs: candidate
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/image-candidate-')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/image-fragments
          merge-multiple: true
      - name: Collect verified repository digests
        run: python scripts/build_factory_images.py --merge-fragments "$RUNNER_TEMP/image-fragments" --output "$RUNNER_TEMP/images.lock.json"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-image-index
          path: ${{ runner.temp }}/images.lock.json
          if-no-files-found: error
