[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sandbox-factory"
version = "2026.11.24.135235"
description = "Run Pi, Codex, Claude Code and Antigravity in isolated coding sandboxes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual==8.1.1", "textual-fspicker==1.0.1", "pyfiglet>=1.0.2,<2", "packaging>=24", "argon2-cffi>=23.1,<26", "PyYAML>=6,<7", "keyring>=25.7,<26"]

[project.urls]
Homepage = "https://github.com/kyuz0/ai-sandbox-factory"
Repository = "https://github.com/kyuz0/ai-sandbox-factory"
Issues = "https://github.com/kyuz0/ai-sandbox-factory/issues"

[project.scripts]
ai-sandbox-factory = "ai_sandbox_factory.cli:main"

[tool.setuptools]
packages = [
    "ai_sandbox_factory",
    "ai_sandbox_factory.connectors",
    "ai_sandbox_factory.connectors.builtin",
    "ai_sandbox_factory.connectors.builtin.ssh",
    "ai_sandbox_factory.connectors.builtin.aws",
]
include-package-data = true

[tool.setuptools.package-data]
ai_sandbox_factory = ["containers/**/*", "profiles/**/*", "providers/**/*", "checks/*", "network-catalog/*"]

"ai_sandbox_factory.connectors" = ["builtin/*/*.json", "companion/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo", "containers/inference/node_modules/*"]
